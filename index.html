<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Nie</title>
    <meta name="description" content="Marco Nie — 个人主页。博客、代码、简历与更多。">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Mouse tracking glow -->
    <div class="glow" id="glow" aria-hidden="true"></div>

    <main>
        <h1 class="name" id="name" aria-label="marco nie">marco nie</h1>
        <p class="subtitle">I'm dancing at the feet of my lord...</p>
        <hr class="divider">
        <nav aria-label="主导航">
            <ul>
                <li><a href="https://blog.niekun.net/">我的博客<span class="underline"></span></a></li>
                <li><a href="https://niekun.net/resume">我的简历<span class="underline"></span></a></li>
                <li><a href="https://github.com/nie11kun">我的代码<span class="underline"></span></a></li>
                <li><a href="https://niekun.net/cloud/">我的云盘<span class="underline"></span></a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1EtoJ3aX8fNvC0?si=oWVOxAkcR7-RsxW_d838cw">喜欢的歌<span class="underline"></span></a></li>
                <li><a href="https://blog.niekun.net/start-page.html">关于我<span class="underline"></span></a></li>
            </ul>
        </nav>
    </main>

    <footer>
        <p>© Marco Nie</p>
    </footer>

    <script>
        // Letter-by-letter entrance animation
        (function () {
            const nameEl = document.getElementById('name');
            const text = nameEl.textContent;
            nameEl.innerHTML = '';
            nameEl.setAttribute('aria-label', text);

            let delay = 0;
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                if (text[i] === ' ') {
                    span.innerHTML = '&nbsp;';
                    span.style.width = '0.3em';
                } else {
                    span.textContent = text[i];
                    span.classList.add('letter');
                    span.style.animationDelay = `${delay * 80 + 200}ms`;
                    delay++;
                }
                nameEl.appendChild(span);
            }
        })();

        // Interactive Effects (Glow + Touch Hover)
        (function () {
            var glow = document.getElementById('glow');
            var navLinks = document.querySelectorAll('nav a');
            var currentActiveLink = null;
            var touchStartPos = null;
            var hasMoved = false;

            function showGlow(x, y) {
                glow.style.left = x + 'px';
                glow.style.top = y + 'px';
                glow.style.opacity = '1';
            }

            function hideGlow() {
                glow.style.opacity = '0';
            }

            function findLinkAt(x, y) {
                for (var i = 0; i < navLinks.length; i++) {
                    var rect = navLinks[i].getBoundingClientRect();
                    if (x >= rect.left - 20 && x <= rect.right + 20 &&
                        y >= rect.top - 10 && y <= rect.bottom + 10) {
                        return navLinks[i];
                    }
                }
                return null;
            }

            function setActiveLink(link) {
                if (currentActiveLink !== link) {
                    if (currentActiveLink) {
                        currentActiveLink.style.color = '';
                        var underline = currentActiveLink.querySelector('.underline');
                        if (underline) {
                            underline.style.width = '0';
                            underline.style.left = '50%';
                        }
                    }
                    if (link) {
                        link.style.color = '#e8e8ec';
                        var underline = link.querySelector('.underline');
                        if (underline) {
                            underline.style.width = '100%';
                            underline.style.left = '0';
                        }
                    }
                    currentActiveLink = link;
                }
            }

            // ---- Mouse (desktop) ----
            document.addEventListener('mousemove', function (e) {
                showGlow(e.clientX, e.clientY);
            });
            document.addEventListener('mouseleave', hideGlow);

            // ---- Touch (iOS Safari) ----
            // passive:false + preventDefault() on touchstart is required
            // to prevent iOS Safari from stealing the gesture
            document.addEventListener('touchstart', function (e) {
                e.preventDefault();
                if (e.touches.length > 0) {
                    var t = e.touches[0];
                    touchStartPos = { x: t.clientX, y: t.clientY };
                    hasMoved = false;
                    showGlow(t.clientX, t.clientY);
                    setActiveLink(findLinkAt(t.clientX, t.clientY));
                }
            }, { passive: false });

            document.addEventListener('touchmove', function (e) {
                e.preventDefault();
                if (e.touches.length > 0) {
                    var t = e.touches[0];
                    hasMoved = true;
                    showGlow(t.clientX, t.clientY);
                    setActiveLink(findLinkAt(t.clientX, t.clientY));
                }
            }, { passive: false });

            document.addEventListener('touchend', function (e) {
                // Detect tap: if finger barely moved, treat as a click
                if (touchStartPos && !hasMoved && e.changedTouches.length > 0) {
                    var t = e.changedTouches[0];
                    var dx = Math.abs(t.clientX - touchStartPos.x);
                    var dy = Math.abs(t.clientY - touchStartPos.y);
                    if (dx < 10 && dy < 10) {
                        var link = findLinkAt(t.clientX, t.clientY);
                        if (link) {
                            window.location.href = link.href;
                        }
                    }
                }
                touchStartPos = null;
                hasMoved = false;
                setActiveLink(null);
                hideGlow();
            }, { passive: true });

            document.addEventListener('touchcancel', function () {
                touchStartPos = null;
                hasMoved = false;
                setActiveLink(null);
                hideGlow();
            }, { passive: true });
        })();
    </script>
</body>

</html>
