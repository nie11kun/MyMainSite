<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Nie</title>
    <meta name="description" content="Marco Nie — 个人主页。博客、代码、简历与更多。">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Mouse tracking glow -->
    <div class="glow" id="glow" aria-hidden="true"></div>

    <main>
        <h1 class="name" id="name" aria-label="marco nie">marco nie</h1>
        <p class="subtitle">I'm dancing at the feet of my lord...</p>
        <hr class="divider">
        <nav aria-label="主导航">
            <ul>
                <li><a href="https://blog.niekun.net/">我的博客</a></li>
                <li><a href="https://niekun.net/resume">我的简历</a></li>
                <li><a href="https://github.com/nie11kun">我的代码</a></li>
                <li><a href="https://niekun.net/cloud/">我的云盘</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1EtoJ3aX8fNvC0?si=oWVOxAkcR7-RsxW_d838cw">喜欢的歌</a></li>
                <li><a href="https://blog.niekun.net/start-page.html">关于我</a></li>
            </ul>
        </nav>
    </main>

    <footer>
        <p>© Marco Nie</p>
    </footer>

    <script>
        // Letter-by-letter entrance animation
        (function () {
            const nameEl = document.getElementById('name');
            const text = nameEl.textContent;
            nameEl.innerHTML = '';
            nameEl.setAttribute('aria-label', text);

            let delay = 0;
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                if (text[i] === ' ') {
                    span.innerHTML = '&nbsp;';
                    span.style.width = '0.3em';
                } else {
                    span.textContent = text[i];
                    span.classList.add('letter');
                    span.style.animationDelay = `${delay * 80 + 200}ms`;
                    delay++;
                }
                nameEl.appendChild(span);
            }
        })();

        // Mouse-tracking glow
        (function () {
            const glow = document.getElementById('glow');
            let ticking = false;

            document.addEventListener('mousemove', function (e) {
                if (!ticking) {
                    requestAnimationFrame(function () {
                        glow.style.left = e.clientX + 'px';
                        glow.style.top = e.clientY + 'px';
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        })();
    </script>
</body>

</html>
