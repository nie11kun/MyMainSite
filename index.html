<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marco Nie</title>
    <meta name="description" content="Marco Nie — 个人主页。博客、代码、简历与更多。">
    <meta name="theme-color" content="#0a0a0b">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Mouse tracking glow -->
    <div class="glow" id="glow" aria-hidden="true"></div>

    <main>
        <h1 class="name" id="name" aria-label="marco nie">marco nie</h1>
        <p class="subtitle">I'm dancing at the feet of my lord...</p>
        <hr class="divider">
        <nav aria-label="主导航">
            <ul>
                <li><a href="https://blog.niekun.net/">我的博客</a></li>
                <li><a href="https://niekun.net/resume">我的简历</a></li>
                <li><a href="https://github.com/nie11kun">我的代码</a></li>
                <li><a href="https://niekun.net/cloud/">我的云盘</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1EtoJ3aX8fNvC0?si=oWVOxAkcR7-RsxW_d838cw">喜欢的歌</a></li>
                <li><a href="https://blog.niekun.net/start-page.html">关于我</a></li>
            </ul>
        </nav>
    </main>

    <footer>
        <p>© Marco Nie</p>
    </footer>

    <script>
        // Letter-by-letter entrance animation
        (function () {
            const nameEl = document.getElementById('name');
            const text = nameEl.textContent;
            nameEl.innerHTML = '';
            nameEl.setAttribute('aria-label', text);

            let delay = 0;
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                if (text[i] === ' ') {
                    span.innerHTML = '&nbsp;';
                    span.style.width = '0.3em';
                } else {
                    span.textContent = text[i];
                    span.classList.add('letter');
                    span.style.animationDelay = `${delay * 80 + 200}ms`;
                    delay++;
                }
                nameEl.appendChild(span);
            }
        })();

        // Interactive Effects (Glow + Mobile Touch Hover)
        (function () {
            const glow = document.getElementById('glow');
            const navLinks = document.querySelectorAll('nav a');
            let ticking = false;
            let currentActiveLink = null;

            function updateEffects(x, y) {
                if (!ticking) {
                    requestAnimationFrame(function () {
                        // Make glow visible on touch
                        glow.classList.add('active');

                        // 1. Update glow position
                        glow.style.left = x + 'px';
                        glow.style.top = y + 'px';

                        // 2. Update touch hover state (only relevant for touch)
                        const element = document.elementFromPoint(x, y);
                        const targetLink = element ? element.closest('nav a') : null;

                        if (currentActiveLink !== targetLink) {
                            if (currentActiveLink) currentActiveLink.classList.remove('touch-active');
                            if (targetLink) targetLink.classList.add('touch-active');
                            currentActiveLink = targetLink;
                        }
                        
                        ticking = false;
                    });
                    ticking = true;
                }
            }

            function clearTouchActive() {
                glow.classList.remove('active');
                if (currentActiveLink) {
                    currentActiveLink.classList.remove('touch-active');
                    currentActiveLink = null;
                }
            }

            // Mouse events
            document.addEventListener('mousemove', function (e) {
                updateEffects(e.clientX, e.clientY);
            });

            // Touch events (iOS Safari compatible)
            function handleTouch(e) {
                if (e.touches.length > 0) {
                    updateEffects(e.touches[0].clientX, e.touches[0].clientY);
                }
            }

            document.addEventListener('touchstart', handleTouch, { passive: true });
            document.addEventListener('touchmove', function (e) {
                handleTouch(e);
                // Prevent iOS Safari from interpreting touch drags as page scroll/rubberband
                if (e.cancelable) {
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('touchend', clearTouchActive, { passive: true });
            document.addEventListener('touchcancel', clearTouchActive, { passive: true });
        })();
    </script>
</body>

</html>
